<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Demande d'adhésion</title>
</head>
<body>
    <h1>Formulaire d'adhésion à l'association Djama Guinée</h1>
    <form method="POST">
        <label>Nom :</label><br>
        <input type="text" name="nom" required><br><br>

        <label>Prénom :</label><br>
        <input type="text" name="prenom" required><br><br>

        <label>Date de naissance :</label><br>
        <input type="date" name="date_naissance" required><br><br>

        <label>Adresse :</label><br>
        <input type="text" name="adresse" required><br><br>

        <label>Code postal :</label><br>
        <input type="text" name="code_postal" required><br><br>

        <label>Ville :</label><br>
        <input type="text" name="ville" required><br><br>

        <label>Pays :</label><br>
        <input type="text" name="pays" required><br><br>

        <label>Téléphone :</label><br>
        <input type="text" name="telephone" required><br><br>

        <label>Email :</label><br>
        <input type="email" name="email" required><br><br>

        <input type="submit" value="Envoyer la demande">
    </form>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Demande d'adhésion - {{ association }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header>
    <h1>Demande d'adhésion</h1>
    <nav>
      <a href="{{ url_for('home') }}">Accueil</a> |
      <a href="{{ url_for('adhesion') }}">Demande d’adhésion</a>
    </nav>
  </header>
  <section>
    <form method="POST" action="{{ url_for('adhesion') }}">
      <label for="nom">Nom complet :</label><br />
      <input type="text" id="nom" name="nom" required /><br />

      <label for="email">Email :</label><br />
      <input type="email" id="email" name="email" required /><br />

      <label for="telephone">Téléphone :</label><br />
      <input type="tel" id="telephone" name="telephone" /><br />

      <label for="message">Pourquoi souhaitez-vous adhérer ?</label><br />
      <textarea id="message" name="message" rows="4" required></textarea><br />

      <button type="submit">Envoyer la demande</button>
    </form>
  </section>
</body>
</html>
