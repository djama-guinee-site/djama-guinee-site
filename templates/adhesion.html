<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Demande d'adhésion - {{ association }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header>
    <h1>Demande d'adhésion</h1>
    <nav>
      <a href="{{ url_for('home') }}">Accueil</a> |
      <a href="{{ url_for('adhesion') }}">Demande d’adhésion</a>
    </nav>
  </header>
  <section>
    <form method="POST" action="{{ url_for('adhesion') }}">
      <label for="nom">Nom complet :</label><br />
      <input type="text" id="nom" name="nom" required /><br />

      <label for="email">Email :</label><br />
      <input type="email" id="email" name="email" required /><br />

      <label for="telephone">Téléphone :</label><br />
      <input type="tel" id="telephone" name="telephone" /><br />

      <label for="message">Pourquoi souhaitez-vous adhérer ?</label><br />
      <textarea id="message" name="message" rows="4" required></textarea><br />

      <button type="submit">Envoyer la demande</button>
    </form>
  </section>
</body>
</html>
